<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 452" role="img" aria-label="The row-streaming range stage: each arriving row is processed in place through DC removal, Hann window and range FFT, its kept half written into one row of the resident plane; when a channel's last row lands, the plane finish runs clutter removal and the Doppler pass; the raw frame itself never exists in memory">
  <rect x="0" y="0" width="740" height="452" fill="#FFFFFF"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24292F"/>
    </marker>
  </defs>

  <!-- arrivals -->
  <rect x="20" y="36" width="170" height="56" rx="4" fill="#F4F2EC" stroke="#24292F"/>
  <text x="105" y="59" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">rows arrive one</text>
  <text x="105" y="76" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">at a time, v-major</text>
  <text x="105" y="28" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">UART / host test loop</text>

  <path d="M 190 64 L 248 64" stroke="#24292F" fill="none" marker-end="url(#arr)"/>
  <text x="219" y="54" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">512 B</text>

  <!-- row buffer -->
  <rect x="250" y="36" width="150" height="56" rx="4" fill="#CDEAF2" stroke="#0E7490" stroke-width="1.5"/>
  <text x="325" y="59" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">row buffer</text>
  <text x="325" y="76" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">S = 128 cplx_q15</text>

  <path d="M 325 92 L 325 122" stroke="#24292F" fill="none" marker-end="url(#arr)"/>

  <!-- in-place chain -->
  <rect x="110" y="124" width="430" height="48" rx="4" fill="#F4F2EC" stroke="#24292F"/>
  <text x="325" y="144" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">in place on the row: DC removal &#8594; range Hann &#8594; range FFT</text>
  <text x="325" y="162" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">the buffer IS the workspace &#183; keep the S/2 = 64 positive-beat bins</text>

  <path d="M 325 172 L 325 206" stroke="#24292F" fill="none" marker-end="url(#arr)"/>
  <text x="335" y="194" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">64 bins &#8594; plane row c</text>

  <!-- resident plane -->
  <rect x="180" y="208" width="240" height="128" fill="#EFEDE7" stroke="#24292F"/>
  <g stroke="#24292F" stroke-opacity="0.15">
    <line x1="180" y1="224" x2="420" y2="224"/><line x1="180" y1="240" x2="420" y2="240"/>
    <line x1="180" y1="256" x2="420" y2="256"/><line x1="180" y1="272" x2="420" y2="272"/>
    <line x1="180" y1="288" x2="420" y2="288"/><line x1="180" y1="304" x2="420" y2="304"/>
    <line x1="180" y1="320" x2="420" y2="320"/>
  </g>
  <rect x="180" y="256" width="240" height="16" fill="#CDEAF2" stroke="#0E7490"/>
  <text x="428" y="268" font-family="monospace" font-size="10.5" fill="#0E7490">row c</text>
  <text x="300" y="356" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">resident plane of channel v &#8212; C &#215; R cplx_q15, 8 192 B</text>
  <text x="300" y="372" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">all 12 planes stay resident: the DoA snapshots need them at frame end</text>

  <!-- plane finish -->
  <rect x="500" y="216" width="220" height="112" rx="4" fill="#F4F2EC" stroke="#24292F" stroke-dasharray="5 4"/>
  <text x="610" y="238" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">when c = C&#8722;1:</text>
  <text x="610" y="256" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">plane finish</text>
  <text x="610" y="278" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">slow-time mean removal;</text>
  <text x="610" y="292" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">per range bin: Doppler Hann</text>
  <text x="610" y="306" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">&#8594; FFT &#8594; fftshift</text>
  <text x="610" y="320" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">(column workspace = row buffer)</text>
  <path d="M 420 272 L 498 272" stroke="#24292F" fill="none" marker-end="url(#arr)"/>

  <!-- the absent frame -->
  <rect x="20" y="398" width="700" height="40" rx="4" fill="none" stroke="#24292F" stroke-dasharray="3 4" stroke-opacity="0.5"/>
  <text x="370" y="415" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">what never exists: the raw frame &#8212; V &#183; C &#183; S &#183; 4 = 196 608 B</text>
  <text x="370" y="431" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">the streamed path holds one 512 B row plus the planes that must exist anyway</text>
</svg>
