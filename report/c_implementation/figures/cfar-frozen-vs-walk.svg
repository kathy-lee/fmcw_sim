<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparison of the frozen mask CFAR and the new cell walk on the same power map: the frozen path allocates four map-scale scratch arrays totalling about 84 kibibytes and produces a full mask, while the cell walk allocates nothing and produces a 64-entry ranked list of about 1.5 kibibytes; the threshold decisions are identical" viewBox="0 0 740 470">
  <rect x="0" y="0" width="740" height="470" fill="#FFFFFF"/>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24292F"/>
    </marker>
  </defs>

  <!-- shared input -->
  <rect x="260" y="16" width="220" height="46" rx="4" style="fill:#F4F2EC" stroke="#24292F"/>
  <text x="370" y="36" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">power map, C &#215; R int64</text>
  <text x="370" y="52" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">16 384 B at the shrunk scenario</text>

  <path d="M 300 62 L 185 98" stroke="#24292F" fill="none" marker-end="url(#arr2)"/>
  <path d="M 440 62 L 555 98" stroke="#24292F" fill="none" marker-end="url(#arr2)"/>

  <!-- left: frozen -->
  <text x="185" y="122" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="0.06em" fill="#24292F" opacity="0.65">FROZEN: cfar_q15_ca_mask</text>
  <text x="185" y="140" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">sliding window sums, O(1) per cell</text>

  <!-- scratch stack, heights ~ bytes -->
  <rect x="60" y="152" width="250" height="58" style="fill:#DFDBD0" stroke="#24292F"/>
  <text x="185" y="177" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">padded copy &#183; 30 976 B</text>
  <text x="185" y="194" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">edge-replicated map</text>
  <rect x="60" y="210" width="250" height="44" style="fill:#DFDBD0" stroke="#24292F"/>
  <text x="185" y="236" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">row sums &#183; 22 528 B</text>
  <rect x="60" y="254" width="250" height="60" style="fill:#DFDBD0" stroke="#24292F"/>
  <text x="185" y="279" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">window sums &#215; 2 &#183; 32 768 B</text>
  <text x="185" y="296" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">full ring + guard box</text>
  <text x="322" y="238" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">&#8776; 84 KiB</text>
  <text x="322" y="252" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">scratch</text>

  <path d="M 185 314 L 185 338" stroke="#24292F" fill="none" marker-end="url(#arr2)"/>
  <rect x="90" y="340" width="190" height="44" rx="4" style="fill:#F4F2EC" stroke="#24292F"/>
  <text x="185" y="359" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">mask, C &#215; R uint8</text>
  <text x="185" y="376" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">2 048 B &#183; mostly zeros</text>

  <!-- right: cell walk -->
  <text x="555" y="122" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="0.06em" fill="#24292F" opacity="0.65">NEW: cfar_cells_q15</text>
  <text x="555" y="140" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">direct window sums, O(window) per cell</text>

  <rect x="430" y="152" width="250" height="60" rx="4" fill="none" stroke="#24292F" stroke-dasharray="5 4" stroke-opacity="0.55"/>
  <text x="555" y="178" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F" opacity="0.75">no scratch</text>
  <text x="555" y="196" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">each window recomputed where it is needed</text>

  <path d="M 555 212 L 555 338" stroke="#24292F" fill="none" marker-end="url(#arr2)"/>
  <text x="565" y="270" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">only passing cells,</text>
  <text x="565" y="284" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">ranked cap of 64</text>

  <rect x="440" y="340" width="230" height="44" rx="4" style="fill:#CDEAF2;stroke:#0E7490" stroke-width="1.5"/>
  <text x="555" y="359" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">cells[64] + overflow flag</text>
  <text x="555" y="376" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">1 536 B &#183; power + threshold captured</text>

  <!-- equality bracket -->
  <path d="M 280 404 L 280 416 L 460 416 L 460 404" stroke="#24292F" fill="none" stroke-opacity="0.6"/>
  <text x="370" y="438" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">same threshold decisions, bit for bit</text>
  <text x="370" y="456" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">pinned by test_cfar_cells_q15 against the frozen reference</text>
</svg>
