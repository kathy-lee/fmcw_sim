<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decision flow of the cell walk: for every cell past the minimum-range gate, compute the noise, apply the threshold; passing cells are appended to the list, or when the list is full, replace the weakest kept cell only if their margin is larger, setting the overflow flag; after the walk the list is sorted by doppler then range and returned" viewBox="0 0 740 620">
  <rect x="0" y="0" width="740" height="620" fill="#FFFFFF"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24292F"/>
    </marker>
  </defs>

  <!-- loop container -->
  <rect x="14" y="30" width="712" height="420" rx="8" fill="none" stroke="#24292F" stroke-dasharray="5 4" stroke-opacity="0.45"/>
  <text x="30" y="52" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="0.06em" fill="#24292F" opacity="0.65">FOR EVERY CELL OF THE POWER MAP</text>

  <!-- walk spine -->
  <rect x="30" y="70" width="220" height="52" rx="4" style="fill:#F4F2EC" stroke="#24292F"/>
  <text x="140" y="92" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">take next cell (d, r)</text>
  <text x="140" y="109" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">r &lt; min_range_bins is skipped</text>

  <line x1="140" y1="122" x2="140" y2="150" stroke="#24292F" marker-end="url(#arr)"/>

  <rect x="30" y="152" width="220" height="52" rx="4" style="fill:#F4F2EC" stroke="#24292F"/>
  <text x="140" y="174" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">sum training ring</text>
  <text x="140" y="191" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">edges clamped &#183; no scratch</text>

  <line x1="140" y1="204" x2="140" y2="232" stroke="#24292F" marker-end="url(#arr)"/>

  <rect x="30" y="234" width="220" height="52" rx="4" style="fill:#F4F2EC" stroke="#24292F"/>
  <text x="140" y="256" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">noise = (full &#8722; guard)</text>
  <text x="140" y="273" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">/ n_train</text>

  <line x1="140" y1="286" x2="140" y2="314" stroke="#24292F" marker-end="url(#arr)"/>

  <!-- threshold decision -->
  <rect x="30" y="316" width="220" height="58" rx="28" style="fill:#CDEAF2;stroke:#0E7490" stroke-width="1.5"/>
  <text x="140" y="340" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">(power &#8810; 16)</text>
  <text x="140" y="357" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">&gt; &#945;_q16 &#183; noise ?</text>

  <!-- no branch -->
  <text x="262" y="332" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">no &#8594; continue walk</text>
  <line x1="250" y1="345" x2="330" y2="345" stroke="#24292F" stroke-dasharray="3 3" stroke-opacity="0.6"/>

  <!-- yes branch -->
  <text x="150" y="394" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">yes</text>
  <line x1="140" y1="374" x2="140" y2="400" stroke="#24292F" marker-end="url(#arr)"/>

  <rect x="30" y="402" width="220" height="40" rx="20" style="fill:#F4F2EC" stroke="#24292F"/>
  <text x="140" y="427" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">room in cells[] ?</text>

  <!-- append -->
  <text x="300" y="380" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">yes</text>
  <path d="M 250 422 L 296 422" stroke="#24292F" fill="none" marker-end="url(#arr)"/>
  <rect x="298" y="402" width="170" height="40" rx="4" style="fill:#F4F2EC;stroke:#0E7490" stroke-width="1.5"/>
  <text x="383" y="427" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">append cells[n++]</text>

  <!-- full path -->
  <text x="486" y="416" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">no (list full)</text>
  <path d="M 468 422 L 512 422" stroke="#24292F" fill="none" marker-end="url(#arr)"/>
  <rect x="514" y="382" width="196" height="52" rx="20" style="fill:#F4F2EC" stroke="#24292F"/>
  <text x="612" y="403" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">margin beats the</text>
  <text x="612" y="420" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">weakest kept cell ?</text>
  <text x="514" y="452" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">margin = (power &#8810; 16) &#8722; thresh</text>

  <!-- replace / drop -->
  <text x="560" y="472" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">yes: replace it</text>
  <text x="648" y="472" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">no: drop</text>
  <path d="M 580 434 L 580 484" stroke="#24292F" fill="none" marker-end="url(#arr)"/>
  <path d="M 660 434 L 660 484" stroke="#24292F" fill="none" marker-end="url(#arr)"/>
  <rect x="514" y="486" width="196" height="40" rx="4" style="fill:#F4F2EC" stroke="#24292F"/>
  <text x="612" y="504" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">either way:</text>
  <text x="612" y="519" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">overflow = 1</text>

  <!-- after the loop -->
  <path d="M 140 450 L 140 544" stroke="#24292F" fill="none" marker-end="url(#arr)"/>
  <text x="150" y="500" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">all cells visited</text>

  <rect x="30" y="546" width="220" height="40" rx="4" style="fill:#F4F2EC" stroke="#24292F"/>
  <text x="140" y="571" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">sort cells by (d, r)</text>

  <path d="M 250 566 L 296 566" stroke="#24292F" fill="none" marker-end="url(#arr)"/>
  <rect x="298" y="546" width="170" height="40" rx="4" style="fill:#CDEAF2;stroke:#0E7490" stroke-width="1.5"/>
  <text x="383" y="571" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">return n, cells[]</text>
</svg>
