<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" role="img" aria-label="The referee chain: one complex64 frame feeds both the quantizer, whose bytes cross the UART to the board, and the frozen Q15 chain on the host; the bridge compares the board's detections against the frozen chain's every frame, while the one-pass host path was proven bit-equal to the frozen chain once, offline">
  <rect x="0" y="0" width="740" height="440" fill="#FFFFFF"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24292F"/>
    </marker>
  </defs>

  <!-- source frame -->
  <rect x="240" y="24" width="260" height="52" rx="4" fill="#F4F2EC" stroke="#24292F"/>
  <text x="370" y="46" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">simulator frame</text>
  <text x="370" y="64" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">cast to complex64 ONCE &#8212; both paths read the same array</text>

  <path d="M 300 76 L 195 112" stroke="#24292F" fill="none" marker-end="url(#arr)"/>
  <path d="M 440 76 L 545 112" stroke="#24292F" fill="none" marker-end="url(#arr)"/>

  <!-- board path -->
  <rect x="70" y="114" width="250" height="46" rx="4" fill="#F4F2EC" stroke="#24292F"/>
  <text x="195" y="133" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">fmcw_q15_quantize</text>
  <text x="195" y="150" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">the exact bytes the wire will carry</text>

  <path d="M 195 160 L 195 192" stroke="#24292F" fill="none" marker-end="url(#arr)"/>
  <text x="205" y="182" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">UART, row by row</text>

  <rect x="70" y="194" width="250" height="62" rx="4" fill="#CDEAF2" stroke="#0E7490" stroke-width="1.5"/>
  <text x="195" y="217" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">board</text>
  <text x="195" y="235" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F">onepass_q15_row &#215; 384, then finish</text>
  <text x="195" y="249" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">newlib libm</text>

  <!-- reference path -->
  <rect x="420" y="114" width="250" height="62" rx="4" fill="#F4F2EC" stroke="#24292F"/>
  <text x="545" y="137" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">frozen Q15 chain, host</text>
  <text x="545" y="155" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F">CFrontend.q15_process_frame</text>
  <text x="545" y="169" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">glibc libm</text>

  <!-- proven-once side box -->
  <rect x="420" y="200" width="250" height="60" rx="4" fill="none" stroke="#24292F" stroke-dasharray="5 4"/>
  <text x="545" y="222" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F">proven once, offline, bit-exact:</text>
  <text x="545" y="238" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F">one-pass host = frozen chain</text>
  <text x="545" y="252" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F" opacity="0.7">C parity test + ctypes pytest</text>

  <!-- compare -->
  <path d="M 195 256 L 195 316 L 288 316" stroke="#24292F" fill="none" marker-end="url(#arr)"/>
  <path d="M 545 176 L 545 190" stroke="#24292F" fill="none"/>
  <path d="M 545 260 L 545 316 L 452 316" stroke="#24292F" fill="none" marker-end="url(#arr)"/>

  <rect x="290" y="288" width="160" height="56" rx="4" fill="#EFEDE7" stroke="#24292F"/>
  <text x="370" y="311" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">compare,</text>
  <text x="370" y="329" text-anchor="middle" font-family="monospace" font-size="12" fill="#24292F">every frame</text>

  <!-- grading -->
  <rect x="60" y="368" width="620" height="56" rx="4" fill="#F4F2EC" stroke="#24292F"/>
  <text x="370" y="390" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F">graded by provenance: counts + bins exact (integer arithmetic, no libm)</text>
  <text x="370" y="408" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#24292F">azimuth grid-exact, one-step tie flips counted &#183; x, y, snr_db to 1e-6 (different libm)</text>
</svg>
